version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-deps:
        patterns:
          - "@testing-library/*"
          - "react*"
          - "vite*"
          - "vitest*"
      expo-deps:
        patterns:
          - "expo*"
          - "react-native*"
    ignore:
      - dependency-name: "expo*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-native*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
