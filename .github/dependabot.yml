version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-deps:
        patterns:
          - "@testing-library/*"
          - "react*"
          - "vite*"
          - "vitest*"
      expo-deps:
        patterns:
          - "expo*"
          - "react-native*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
