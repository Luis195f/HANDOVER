name: Residual Python Package Publish (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why PyPI publish is disabled
        run: |
          {
            echo "## Python package publish disabled"
            echo
            echo "- This repository does not define pyproject.toml, setup.py or setup.cfg at the root."
            echo "- Release automation for the pilot remains GitHub releases plus the documented web/Django deployment flow."
            echo "- Re-enable PyPI publication only after a real Python package manifest exists and the publish contract is reviewed."
          } >> "$GITHUB_STEP_SUMMARY"
