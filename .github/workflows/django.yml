name: Django CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      DJANGO_SETTINGS_MODULE: backend.settings
      SECRET_KEY: ci-dummy-secret-key
      OPENAI_API_KEY: dummy
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      HANDOVER_AI_ENABLED: "0"
      HANDOVER_OPENAI_DISABLED: "1"
      AUTH0_ISSUER_BASE_URL: https://example.invalid
      AUTH0_AUDIENCE: handover-api
      FHIR_BASE: http://127.0.0.1:9/fhir
      HANDOVER_FHIR_VALIDATION_MODE: off
      HANDOVER_REQUIRE_RBAC_ON_FHIR: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: python manage.py migrate --noinput

      - name: Run Django backend test suite (pytest)
        run: |
          pytest \
            --ds=backend.settings \
            --maxfail=1 \
            --disable-warnings \
            --disable-socket \
            --allow-hosts=127.0.0.1,localhost \
            backend tests

  coverage:
    needs: django-tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: backend.settings
      SECRET_KEY: ci-dummy-secret-key
      OPENAI_API_KEY: dummy
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      HANDOVER_AI_ENABLED: "0"
      HANDOVER_OPENAI_DISABLED: "1"
      AUTH0_ISSUER_BASE_URL: https://example.invalid
      AUTH0_AUDIENCE: handover-api
      FHIR_BASE: http://127.0.0.1:9/fhir
      HANDOVER_FHIR_VALIDATION_MODE: off
      HANDOVER_REQUIRE_RBAC_ON_FHIR: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: python manage.py migrate --noinput

      - name: Run pytest with coverage (backend only)
        run: |
          pytest \
            --ds=backend.settings \
            --maxfail=1 \
            --disable-warnings \
            --disable-socket \
            --allow-hosts=127.0.0.1,localhost \
            --cov=backend \
            --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            backend tests
          test -f coverage.xml

      - name: Publish coverage summary
        run: |
          {
            echo "## Backend coverage (pytest + coverage.py)"
            echo
            python -c 'import xml.etree.ElementTree as ET; rate=float(ET.parse("coverage.xml").getroot().get("line-rate", "0"))*100; print(f"- Line coverage: {rate:.2f}%")'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage.xml
          retention-days: 7
