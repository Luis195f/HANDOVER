name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -w typecheck

      - name: Lint
        run: pnpm -w lint:ci

      - name: Sensitive any guard
        run: pnpm -w gate:any-sensitive

      # Misma bateria que `pnpm test`; en CI usamos la variante con cobertura
      # para publicar artefactos lcov + Cobertura sin abrir otro runner JS.
      - name: Primary JS test runner (pilot-grade, with coverage)
        run: pnpm -w test:pilot:coverage:ci

      - name: Verify pilot coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f coverage/lcov.info
          test -f coverage/cobertura-coverage.xml

      # Python deps para genbadge (FIX: pin setuptools para recuperar pkg_resources)
      - name: Install python deps for genbadge
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel
          python -m pip install "genbadge[coverage]"
          python -c "import pkg_resources; import defusedxml.ElementTree; print('pkg_resources+defusedxml OK')"

      # Encuentra el XML real y genera badge
      - name: Coverage badge
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing coverage directory:"
          ls -la coverage || true

          echo "Searching Cobertura XML..."
          COV_XML="$(find coverage -maxdepth 4 -type f -iname '*cobertura*.xml' | head -n 1 || true)"
          if [ -z "${COV_XML}" ]; then
            echo "ERROR: No Cobertura XML found. Dumping tree:"
            find coverage -maxdepth 4 -type f | sed -n '1,200p'
            exit 1
          fi

          echo "Using coverage xml: ${COV_XML}"
          genbadge coverage -i "${COV_XML}" -o coverage-badge.svg

      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage-badge.svg
          retention-days: 7

      - name: Publish pilot coverage summary
        shell: bash
        run: |
          {
            echo "## Pilot-grade JS coverage"
            echo
            python -c 'import xml.etree.ElementTree as ET; rate=float(ET.parse("coverage/cobertura-coverage.xml").getroot().get("line-rate", "0"))*100; print(f"- Line coverage: {rate:.2f}%")'
            echo "- Evidence: coverage/lcov.info, coverage/cobertura-coverage.xml, coverage HTML report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pilot coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pilot
          path: coverage
          if-no-files-found: error
          retention-days: 7

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: End-to-end tests
        run: pnpm -w test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate representative FHIR bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          status=0
          pnpm -w validate:fhir 2>&1 | tee artifacts/fhir-validation.txt || status=${PIPESTATUS[0]}
          exit "${status}"

      - name: Upload FHIR validation evidence
        if: always() && hashFiles('artifacts/fhir-validation.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fhir-validation
          path: artifacts/fhir-validation.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish pilot gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Pilot gate evidence"
            echo
            echo "- JS gate commands: pnpm -w typecheck, pnpm -w lint:ci, pnpm -w gate:any-sensitive, pnpm -w test:pilot:coverage:ci, pnpm -w test:e2e, pnpm -w validate:fhir"
            echo "- Uploaded artifacts: coverage-badge, coverage-pilot, playwright-evidence, fhir-validation"
            echo "- Backend pytest and backend coverage remain in the separate Django CI workflow by design."
          } >> "$GITHUB_STEP_SUMMARY"

