name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # En PRs permitimos lockfile flexible para no bloquear iteración.
      # En main (push) exigimos lockfile consistente.
      - name: Install dependencies (PR)
        if: github.event_name == 'pull_request'
        run: pnpm install --no-frozen-lockfile

      - name: Install dependencies (push to main)
        if: github.event_name == 'push'
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -w typecheck

      - name: Lint
        run: pnpm -w lint

      # Genera cobertura Cobertura XML en /coverage
      - name: Unit and integration tests (with coverage)
        run: pnpm -w vitest run --reporter=verbose --coverage --coverage.reporter=cobertura --coverage.reportsDirectory=coverage

      # Python deps para genbadge (FIX: pin setuptools para recuperar pkg_resources)
      - name: Install python deps for genbadge
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel
          python -m pip install "genbadge[coverage]"
          python -c "import pkg_resources; import defusedxml.ElementTree; print('pkg_resources+defusedxml OK')"

      # Encuentra el XML real y genera badge
      - name: Coverage badge
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing coverage directory:"
          ls -la coverage || true

          echo "Searching Cobertura XML..."
          COV_XML="$(find coverage -maxdepth 4 -type f -iname '*cobertura*.xml' | head -n 1 || true)"
          if [ -z "${COV_XML}" ]; then
            echo "ERROR: No Cobertura XML found. Dumping tree:"
            find coverage -maxdepth 4 -type f | sed -n '1,200p'
            exit 1
          fi

          echo "Using coverage xml: ${COV_XML}"
          genbadge coverage -i "${COV_XML}" -o coverage-badge.svg

      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage-badge.svg

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: End-to-end tests
        run: pnpm -w test:e2e

      - name: Validate FHIR bundles
        run: pnpm -w validate:fhir tests/fixtures/fhir/minimal-transaction-bundle.json

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info

