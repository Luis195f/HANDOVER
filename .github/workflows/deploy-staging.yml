name: Deploy Web Staging (static export)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /srv/handover-staging
            git pull origin main
            docker compose --env-file config/staging.env config >/dev/null
            docker compose --env-file config/staging.env pull
            docker compose --env-file config/staging.env up -d --build
