services:
  web:
    # IMPORTANT: build.args values are resolved by Docker Compose variable substitution,
    # not by service env_file. Use either:
    #   1) docker compose --env-file config/staging.env build web
    #   2) a project-level .env file
    # so EXPO_PUBLIC_* values are present at build time.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_BASE_URL: http://192.168.0.16:8000
        EXPO_PUBLIC_FHIR_BASE_URL: http://192.168.0.16:8080/fhir
        EXPO_PUBLIC_ALLOWED_UNITS: ${EXPO_PUBLIC_ALLOWED_UNITS}
        EXPO_PUBLIC_ALLOW_ALL_UNITS: ${EXPO_PUBLIC_ALLOW_ALL_UNITS}
        EXPO_PUBLIC_BYPASS_SCOPE: ${EXPO_PUBLIC_BYPASS_SCOPE}
        EXPO_PUBLIC_STORAGE_NAMESPACE: handover-pro
        EXPO_PUBLIC_OFFLINE_ENCRYPTION_KEY: ${EXPO_PUBLIC_OFFLINE_ENCRYPTION_KEY}
        EXPO_PUBLIC_OFFLINE_REPLAY_MAX_ATTEMPTS: ${EXPO_PUBLIC_OFFLINE_REPLAY_MAX_ATTEMPTS}
        EXPO_PUBLIC_QUEUE_BACKOFF_BASE: ${EXPO_PUBLIC_QUEUE_BACKOFF_BASE}
        EXPO_PUBLIC_FAST_VALIDATE_BEFORE_QUEUE: ${EXPO_PUBLIC_FAST_VALIDATE_BEFORE_QUEUE}
        EXPO_PUBLIC_CLIENT_SIGNING_ENABLED: ${EXPO_PUBLIC_CLIENT_SIGNING_ENABLED}
        EXPO_PUBLIC_HANDOVER_FHIR_VALIDATION_MODE: ${EXPO_PUBLIC_HANDOVER_FHIR_VALIDATION_MODE}
        EXPO_PUBLIC_OFFLINE_ENCRYPTION_DISABLED: true
        EXPO_PUBLIC_ENABLE_DEMO: 0
        OIDC_ISSUER: https://dev-6jmxxysflz2kx61w.us.auth0.com
        OIDC_CLIENT_ID: zJxhI0SK1J4hmzr1KNzEbWddgZWJDUlL
        OIDC_AUDIENCE: https://api.luis-soto.info
        OIDC_SCOPE: openid profile email offline_access
        OIDC_REDIRECT_SCHEME: handover-pro
    env_file:
      - config/staging.env
    environment:
      EXPO_PUBLIC_API_BASE_URL: http://192.168.0.16:8000
      EXPO_PUBLIC_FHIR_BASE_URL: http://192.168.0.16:8080/fhir
      EXPO_PUBLIC_ALLOWED_UNITS: ${EXPO_PUBLIC_ALLOWED_UNITS}
      EXPO_PUBLIC_ALLOW_ALL_UNITS: ${EXPO_PUBLIC_ALLOW_ALL_UNITS}
      EXPO_PUBLIC_BYPASS_SCOPE: ${EXPO_PUBLIC_BYPASS_SCOPE}
      EXPO_PUBLIC_STORAGE_NAMESPACE: handover-pro
      EXPO_PUBLIC_OFFLINE_ENCRYPTION_KEY: ${EXPO_PUBLIC_OFFLINE_ENCRYPTION_KEY}
      EXPO_PUBLIC_OFFLINE_REPLAY_MAX_ATTEMPTS: ${EXPO_PUBLIC_OFFLINE_REPLAY_MAX_ATTEMPTS}
      EXPO_PUBLIC_QUEUE_BACKOFF_BASE: ${EXPO_PUBLIC_QUEUE_BACKOFF_BASE}
      EXPO_PUBLIC_FAST_VALIDATE_BEFORE_QUEUE: ${EXPO_PUBLIC_FAST_VALIDATE_BEFORE_QUEUE}
      EXPO_PUBLIC_CLIENT_SIGNING_ENABLED: ${EXPO_PUBLIC_CLIENT_SIGNING_ENABLED}
      EXPO_PUBLIC_HANDOVER_FHIR_VALIDATION_MODE: ${EXPO_PUBLIC_HANDOVER_FHIR_VALIDATION_MODE}
      EXPO_PUBLIC_OFFLINE_ENCRYPTION_DISABLED: true
      EXPO_PUBLIC_ENABLE_DEMO: 0
      OIDC_ISSUER: https://dev-6jmxxysflz2kx61w.us.auth0.com
      OIDC_CLIENT_ID: zJxhI0SK1J4hmzr1KNzEbWddgZWJDUlL
      OIDC_AUDIENCE: https://api.luis-soto.info
      OIDC_SCOPE: openid profile email offline_access
      OIDC_REDIRECT_SCHEME: handover-pro
    ports:
      - "8080:80"
    restart: unless-stopped
