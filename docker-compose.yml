services:
  web:
    # Primary automated pilot target: Expo web static export served by nginx.
    # This compose file only builds the web artifact. The Django backend is
    # expected to run separately using the Procfile-compatible gunicorn command.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL}
        EXPO_PUBLIC_FHIR_BASE_URL: ${EXPO_PUBLIC_FHIR_BASE_URL}
        EXPO_PUBLIC_ALLOWED_UNITS: ${EXPO_PUBLIC_ALLOWED_UNITS}
        EXPO_PUBLIC_ALLOW_ALL_UNITS: ${EXPO_PUBLIC_ALLOW_ALL_UNITS}
        EXPO_PUBLIC_BYPASS_SCOPE: ${EXPO_PUBLIC_BYPASS_SCOPE}
        EXPO_PUBLIC_STORAGE_NAMESPACE: ${EXPO_PUBLIC_STORAGE_NAMESPACE:-handover-pro}
        EXPO_PUBLIC_OFFLINE_REPLAY_MAX_ATTEMPTS: ${EXPO_PUBLIC_OFFLINE_REPLAY_MAX_ATTEMPTS}
        EXPO_PUBLIC_QUEUE_BACKOFF_BASE: ${EXPO_PUBLIC_QUEUE_BACKOFF_BASE}
        EXPO_PUBLIC_FAST_VALIDATE_BEFORE_QUEUE: ${EXPO_PUBLIC_FAST_VALIDATE_BEFORE_QUEUE}
        EXPO_PUBLIC_CLIENT_SIGNING_ENABLED: ${EXPO_PUBLIC_CLIENT_SIGNING_ENABLED}
        EXPO_PUBLIC_HANDOVER_FHIR_VALIDATION_MODE: ${EXPO_PUBLIC_HANDOVER_FHIR_VALIDATION_MODE}
        EXPO_PUBLIC_HANDOVER_DEPLOYMENT_MODE: ${EXPO_PUBLIC_HANDOVER_DEPLOYMENT_MODE}
        EXPO_PUBLIC_HANDOVER_PILOT_CONTROL_JSON: ${EXPO_PUBLIC_HANDOVER_PILOT_CONTROL_JSON}
        EXPO_PUBLIC_HANDOVER_UNITS_JSON: ${EXPO_PUBLIC_HANDOVER_UNITS_JSON}
        EXPO_PUBLIC_HANDOVER_PROFILE_ACTIVATION_JSON: ${EXPO_PUBLIC_HANDOVER_PROFILE_ACTIVATION_JSON}
        EXPO_PUBLIC_SHOW_NIC_CODING: ${EXPO_PUBLIC_SHOW_NIC_CODING}
        EXPO_PUBLIC_SHOW_NOC_OUTCOMES: ${EXPO_PUBLIC_SHOW_NOC_OUTCOMES}
        EXPO_PUBLIC_SHOW_HANDOVER_TIMING_METRICS: ${EXPO_PUBLIC_SHOW_HANDOVER_TIMING_METRICS}
        EXPO_PUBLIC_HIDE_LEGACY_FIELDS: ${EXPO_PUBLIC_HIDE_LEGACY_FIELDS}
        EXPO_PUBLIC_ENABLE_ICEA_BRIDGE: ${EXPO_PUBLIC_ENABLE_ICEA_BRIDGE}
        EXPO_PUBLIC_ENABLE_ICEA_IMMEDIATE_SCORING: ${EXPO_PUBLIC_ENABLE_ICEA_IMMEDIATE_SCORING}
        EXPO_PUBLIC_ENABLE_ICEA_ENRICHED_SCORING: ${EXPO_PUBLIC_ENABLE_ICEA_ENRICHED_SCORING}
        EXPO_PUBLIC_ENABLE_ICEA_PATIENT_RISK: ${EXPO_PUBLIC_ENABLE_ICEA_PATIENT_RISK}
        EXPO_PUBLIC_ENABLE_ICEA_CAUSAL_SUMMARY: ${EXPO_PUBLIC_ENABLE_ICEA_CAUSAL_SUMMARY}
        EXPO_PUBLIC_AI_SUGGESTIONS_ENABLED: ${EXPO_PUBLIC_AI_SUGGESTIONS_ENABLED}
        EXPO_PUBLIC_OFFLINE_ENCRYPTION_DISABLED: ${EXPO_PUBLIC_OFFLINE_ENCRYPTION_DISABLED:-false}
        EXPO_PUBLIC_ENABLE_DEMO: ${EXPO_PUBLIC_ENABLE_DEMO:-0}
        OIDC_ISSUER: ${OIDC_ISSUER}
        OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
        OIDC_AUDIENCE: ${OIDC_AUDIENCE}
        OIDC_SCOPE: ${OIDC_SCOPE}
        OIDC_REDIRECT_SCHEME: ${OIDC_REDIRECT_SCHEME}
    env_file:
      - config/staging.env
    ports:
      - "8080:80"
    restart: unless-stopped
